services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lettermate
      POSTGRES_USER: lettermate
      POSTGRES_PASSWORD: lettermate
    ports:
      - "5432:5432"
    volumes:
      - lettermate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lettermate"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - lettermate-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lettermate-postgres:
  lettermate-redis:
