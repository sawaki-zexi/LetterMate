[project]
name = "lettermate"
version = "0.1.0"
description = "Personal Intelligence Agent for multi-source newsletter generation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13.2",
  "apscheduler>=3.10.4",
  "beautifulsoup4>=4.12.3",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "feedparser>=6.0.11",
  "httpx>=0.27.2",
  "jinja2>=3.1.4",
  "nh3>=0.2.18",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "psycopg[binary]>=3.2.1",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0.32",
  "typer>=0.12.5",
  "uvicorn>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "mypy>=1.11.2",
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.3"
]

[project.scripts]
lettermate = "lettermate.cli:app"

[build-system]
requires = ["setuptools>=72.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
